tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380000000006'
          contactType:
            description: 'Contact type of phone number'
            type: string
            enum: ['work', 'home', 'personal']
          email:
            description: "Contact's email address"
            type: string
            example: andriy7@example.com
          isFavourite:
            description: 'Favourite contact'
            type: boolean
            example: true
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary

responses:
  '201':
    $ref: '../../components/responses/201.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
